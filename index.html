<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ستار مارين — سعر الشحن من الصين</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--ink:#0f2a3d;--or:#f26522;--bg:#eef2f5;--card:#fff;--mut:#5b6b78;--ln:#d5dde3}
*{box-sizing:border-box}body{margin:0;font-family:Cairo,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
header{background:var(--ink);color:#fff;padding:18px 16px;display:flex;gap:12px;align-items:center}
header img{width:52px;height:52px;border-radius:12px;object-fit:contain;background:#fff;padding:4px}
header h1{margin:0;font-size:19px;font-weight:800}header p{margin:0;font-size:13px;opacity:.8}
main{max-width:520px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:12px}
h2{font-size:18px;margin:0 0 10px}label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--ln);border-radius:10px;background:#fff}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--or);outline-offset:1px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.o{font:inherit;padding:12px 8px;border:1.5px solid var(--ln);border-radius:10px;background:#fff;cursor:pointer;color:var(--ink)}
.o.on{border-color:var(--or);background:#fff3ec;font-weight:800}
.btn{display:block;width:100%;font:inherit;font-weight:800;padding:14px;border:0;border-radius:12px;background:var(--or);color:#fff;cursor:pointer;margin-top:14px;text-align:center;text-decoration:none}
.btn.alt{background:var(--ink)}.btn:disabled{opacity:.4}
.price{font-size:26px;font-weight:800;color:var(--or)}.sub{font-size:13px;color:var(--mut)}
.warn{background:#fff8e1;border:1px solid #f0d98a;border-radius:10px;padding:10px;font-size:13px;margin-top:10px}
.err{color:#c62828;font-size:13px;min-height:18px}
header{position:relative;overflow:hidden}.sh{position:absolute;bottom:2px;font-size:26px;animation:sail 9s linear infinite}
@keyframes sail{from{right:-40px}to{right:105%}}@media(prefers-reduced-motion:reduce){.sh{animation:none;right:12px}}
.o{transition:transform .15s}.o:active{transform:scale(.95)}
@keyframes bob{50%{transform:translateY(3px)}}.bob{animation:bob 3s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.bob{animation:none}}

const stq=()=>{const r=(S.loc==='port'?ST.port:ST.out)*(S.dis==='1'?1-ST.disc:1),st=r*(+S.scbm||0)*(+S.days||1),lb=(+S.cn||0)*ST.labor;return{st,lb,total:st+lb}};
function storeHtml(){const q=stq();return `<a class="back" data-k="n" data-v="1">رجوع</a><div class="card"><h2>خدمة التخزين 🏬</h2><div class="opts">${btn(S.loc==='port','داخل الميناء','loc','port')}${btn(S.loc==='out','خارج الميناء','loc','out')}</div>
<label for="sc">الحجم (م³)</label><input id="sc" type="number" inputmode="decimal" min="0" value="${S.scbm}"><label for="sd">عدد الأيام</label><input id="sd" type="number" inputmode="numeric" min="1" value="${S.days}"><label for="sn">عدد الحاويات (عمالة ومعدات)</label><input id="sn" type="number" inputmode="numeric" min="0" value="${S.cn}">
<label>مهيئات (خصم 15%)</label><div class="opts">${btn(S.dis==='1','نعم','dis','1')}${btn(S.dis!=='1','لا','dis','0')}</div>
<div class="warn" style="margin-top:14px"><div class="price">${fm(q.total)} جنيه</div><div class="sub">تخزين ${fm(q.st)} + عمالة ومعدات ${fm(q.lb)}</div></div><p class="sub">أسعار تقريبية وبتتغير. السعر النهائي بعد التأكيد.</p>
<label for="nm">الاسم الثلاثي</label><input id="nm" value="${S.name}"><div class="err" id="e"></div><button class="btn" id="sendst">أرسل الطلب</button></div>`}
function reqHtml(){const u=S.svc==='uae';return `<a class="back" data-k="n" data-v="1">رجوع</a><div class="card"><h2>${u?'الشحن من الإمارات 🇦🇪':'طلب وشحن من SHEIN 🛍️'}</h2><p class="sub">${u?'الخدمة حسب الطلب. السعر بيتحدد بعد معاينة طلبك (شحن جوي أو بري).':'نطلب لك من SHEIN ونشحن لحد مصر. السعر بعد معاينة الطلب.'}</p>${u?`<label>طريقة الشحن</label><div class="opts">${btn(S.umode!=='land','✈️ جوي','umode','air')}${btn(S.umode==='land','🚚 بري','umode','land')}</div>`:''}<label for="pd">${u?'وصف الشحنة':'لينكات المنتجات (لينك في كل سطر)'}</label><textarea id="pd" rows="4">${esc(S.prod)}</textarea><label for="qt">${u?'الوزن أو الحجم التقريبي':'عدد القطع'}</label><input id="qt" value="${esc(S.qty)}"><label for="nm">الاسم الثلاثي</label><input id="nm" value="${esc(S.name)}"><div class="err" id="e"></div><button class="btn" id="sendr">أرسل الطلب</button></div>`}
function payBox(){const v=PAY[S.pay]||'';return /^https?:\/\//.test(v)?`<a class="btn" target="_blank" rel="noopener" href="${esc(v)}">ادفع الآن</a>`:`<div class="warn">${esc(v||'هنبعتلك بيانات الدفع على واتساب.')}</div>`}
function doneHtml(){return `<div class="card"><h2>وصل طلبك ✅</h2><p>سجّلنا طلبك. كمّل على واتساب عشان نرد عليك أسرع:</p>${waLinks(S.msg)}</div>`+(S.svc==='fac'?`<div class="card"><h2>الدفع لخدمة ربط المصانع (600 جنيه)</h2><div class="opts">${[['bank','🏦 تحويل بنكي'],['insta','⚡ انستا باي'],['card','💳 بطاقة'],['wallet','📱 محفظة']].map(x=>btn(S.pay===x[0],x[1],'pay',x[0])).join('')}</div>${S.pay?payBox():''}</div>`:'')}
function navHtml(){return `<nav class="nav">${[['home','🏠','الرئيسية'],['orders','📦','الطلبات'],['ai','✨','مستشار'],['chat','💬','المحادثات'],['more','☰','المزيد']].map(x=>`<button class="nb${S.tab===x[0]?' on':''}" data-k="tab" data-v="${x[0]}"><span>${x[1]}</span>${x[2]}</button>`).join('')}</nav>`}

 if(t==='orders'){const o=ls('sm_orders')||[];return `<div class="card"><h2>طلباتي 📦</h2>${o.length?o.map(x=>`<div class="warn" style="background:#f4f8fa;border-color:var(--ln)"><b>${esc(x.d)}</b> — ${esc(x.t)}<div class="sub">كود ${esc(x.id)}</div></div>`).join(''):'<p class="sub">مفيش طلبات لسه.</p>'}</div>`}
 if(t==='chat')return `<div class="card"><h2>خدمة العملاء 💬</h2><p class="sub">كلّمنا على واتساب:</p>${waLinks('أهلاً، محتاج مساعدة من خدمة العملاء')}</div>`;
 if(t==='ai'){const a=S.faq>=0&&FAQ[S.faq]?`<div class="warn"><b>${FAQ[S.faq][0]}</b><p>${esc(FAQ[S.faq][1])}</p></div>`:'';return `<div class="card"><h2>المستشار ✨</h2><p class="sub">اختار سؤال أو اكتب سؤالك:</p><div class="opts">${FAQ.map((f,i)=>btn(S.faq===i,f[0],'faq',i)).join('')}</div>${a}<label for="fq">اسأل</label><input id="fq" placeholder="اكتب سؤالك"><button class="btn alt" id="fqb">إرسال</button></div>`}

 if(m==='acc')return bk+`<div class="card"><h2>حسابي</h2>${[['prof','الملف الشخصي'],['addr','قائمة العناوين'],['inv','الفواتير'],['bank','الحسابات البنكية']].map(x=>`<button class="li" data-k="more" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>`;
 if(m==='set')return bk+`<div class="card"><h2>الإعدادات والتطبيق</h2><button class="li" data-k="out" data-v="1" style="color:#c62828">تسجيل الخروج</button></div>`;
 return `<div class="card"><h2>المزيد</h2>${[['about','نبذة عن الشركة'],['acc','حسابي'],['set','الإعدادات والتطبيق']].map(x=>`<button class="li" data-k="more" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>`}

function log(stage,extra){if(!SHEET_URL)return;fetch(SHEET_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(Object.assign({id:S.id,stage,type:S.type,phone:S.phone,name:S.name,gov:S.gov,service:S.svc,email:S.email},extra||{}))}).catch(()=>{})}
function quote(){
 if(S.mode==='pax'){const it=PAX[+S.px||0],k=+S.kg||0;return{ok:k>0,cur:'¥',usd:k*(it[2]+PAX_MARGIN),txt:`شحن جوي مع المسافرين: ${it[0]} ${k} ${it[1]}`}}
 if(S.mode==='air'){const k=Math.max(+S.kg||0,R.airMin);return{ok:+S.kg>0,usd:k*R.airKg,txt:`شحن جوي ${k} كجم`}}
 if(S.mode==='lcl')return{ok:+S.cbm>0,usd:(+S.cbm||0)*R.lclCbm,txt:`شحن جزئي ${S.cbm} م³`};
 const r=R.fcl[S.pol],i=S.cont==='20'?0:1,adj=PODS[S.pod],t=`حاوية ${S.cont==='20'?'20GP':'40HQ'} من ${S.pol} إلى ${S.pod}`;
 return{ok:!!r&&adj!=null,usd:r&&adj!=null?r[i]+R.telex+adj:0,txt:t,onReq:adj==null}}
function waLinks(msg){return WA.map(w=>`<a class="btn${w===WA[0]?'':' alt'}" target="_blank" rel="noopener" href="https://wa.me/${w[1]}?text=${encodeURIComponent(msg)}">كلّم ${w[0]} على واتساب</a>`).join('')}
function draw(){let h='';
 if(S.n===0)h=`<div class="card" style="padding:12px"><img src="${LOGO_FULL}" alt="ستار مارين" style="width:100%;max-width:300px;display:block;margin:0 auto 10px">${HEROX()}</div><div class="card"><h2>أهلاً بيك 👋</h2><p class="sub">سجّل دخولك عشان تعرف تكلفة شحنتك من الصين.</p>
 <label>أنت</label><div class="opts">${TYPES.map(t=>btn(S.type===t,t,'type',t)).join('')}</div>
 <label for="ph">رقم الموبايل</label><input id="ph" inputmode="tel" placeholder="01XXXXXXXXX" value="${S.phone}">
 ${GOOGLE_CLIENT_ID?'<p class="sub" style="text-align:center;margin:12px 0 4px">أو سجّل بجيميل</p><div id="gb" style="display:flex;justify-content:center"></div><div class="sub" id="gm" style="text-align:center">'+(S.email?'✓ '+S.email:'')+'</div>':''}
 <div class="err" id="e"></div><button class="btn" id="go">دخول</button></div>`;
 else if(S.n===1)h=`<div class="card"><h2>تحتاج إيه؟</h2><button class="btn" data-k="svc" data-v="ship">حاسبة الشحن من الصين (بحري / جوي)</button><button class="btn alt" data-k="svc" data-v="fac">ربط مع مصنع صيني 🏭</button><button class="btn alt" data-k="svc" data-v="uae">الشحن من الإمارات 🇦🇪 (حسب الطلب)</button><button class="btn alt" data-k="svc" data-v="shein">طلب وشحن من SHEIN 🛍️</button><button class="btn alt" data-k="svc" data-v="store">خدمة التخزين 🏬</button><button class="btn alt" data-k="svc" data-v="study">دراسة تكلفة استيراد كاملة (بالجمارك) 🧾</button><p class="sub">الصين: زيارة أو فتح مكتب؟ اكتب لنا على واتساب وهنرتب حسب طلبك.</p>${waLinks('أهلاً، عايز أستفسر عن خدمات الصين (زيارة / فتح مكتب)')}</div>`;
 else if(S.n===3)h=doneHtml();
 else if(S.svc==='store')h=storeHtml();
 else if(S.svc==='uae'||S.svc==='shein')h=reqHtml();
 else if(S.svc==='ship'){const q=quote(),f=fresh();
  h=`<a class="back" data-k="n" data-v="1">رجوع</a><div class="card"><h2>حاسبة الشحن</h2><div class="opts">${[['lcl','📦 بحري جزئي'],['fcl','🚢 حاوية كاملة'],['air','✈️ جوي (خطوط جوية)'],['pax','🧳 جوي مع مسافرين']].map(m=>btn(S.mode===m[0],m[1],'mode',m[0])).join('')}</div>
  ${S.mode==='lcl'?`<label for="cbm">الحجم (م³)</label><input id="cbm" type="number" inputmode="decimal" min="0" step="0.1" value="${S.cbm}">`:''}
  ${S.mode==='pax'?`<label>الصنف</label><div class="opts">${PAX.map((x,i)=>btn(+S.px===i,x[0],'px',i)).join('')}</div>`:''}
  ${S.mode==='air'||S.mode==='pax'?`<label for="kg">${S.mode==='pax'?'الكمية ('+PAX[+S.px||0][1]+')':'الوزن (كجم)'}</label><input id="kg" type="number" inputmode="decimal" min="0" value="${S.kg}">`:''}
  ${S.mode==='fcl'?`<label>الحاوية</label><div class="opts">${btn(S.cont==='20','20GP','cont','20')}${btn(S.cont==='40','40HQ','cont','40')}</div><label for="pol">ميناء التحميل في الصين</label><select id="pol">${Object.keys(R.fcl).map(p=>`<option${p===S.pol?' selected':''}>${p}</option>`).join('')}</select><label for="pod">ميناء الوصول في مصر</label><select id="pod">${Object.keys(PODS).map(p=>`<option${p===S.pod?' selected':''}>${p}</option>`).join('')}</select>`:''}
  <div style="margin-top:14px" id="pr">${f&&q.ok?`<div class="price">${q.cur||'$'}${fm(q.usd)}</div><div class="sub">${q.txt} — تكلفة شحن فقط، <b>بدون جمارك</b> (الجمارك تختلف حسب الصنف)، وصالحة حتى ${VALID_UNTIL}${S.mode==='pax'?'. التنفيذ والمسؤولية عن الشحنة على شركة الشحن الشريكة.':''}${UPDATE_DAY?'. تتحدث الأسعار كل '+UPDATE_DAY:''}</div>`:`<div class="warn">${q.onReq?(S.mode==='pax'?'سعر الشحن مع المسافرين عند الطلب.':'السعر لهذا الميناء عند الطلب. أرسل طلبك وسنرد عليك على واتساب.'):f?'أدخل البيانات لعرض السعر.':'الأسعار قيد التحديث الآن. أرسل طلبك وسنرد عليك بالسعر على واتساب.'}</div>`}</div>
  ${catSel()}<label for="nm">الاسم الثلاثي</label><input id="nm" value="${S.name}"><label for="gv">المحافظة</label><select id="gv"><option value="">اختر</option>${GOV.map(g=>`<option${g===S.gov?' selected':''}>${g}</option>`).join('')}</select>
  <label for="pd">اسم المنتج (يساعدنا نحسب الجمارك)</label><input id="pd" value="${S.prod}">${photoBox()}<div class="err" id="e"></div>
  <button class="btn" id="sendq">أرسل الطلب</button></div>`}
 else if(S.svc==='fac'||S.svc==='study')h=`<a class="back" data-k="n" data-v="1">رجوع</a><div class="card">${S.svc==='study'?'<h2>دراسة تكلفة استيراد</h2><p class="sub">نجهز لك تكلفة الشحنة كاملة شاملة الجمارك والمصاريف.</p>':'<h2>ربط مع مصنع صيني</h2><p class="sub">اشتراك الخدمة 600 جنيه. نبحث عن مصانع تطابق طلبك ونتواصل معها معك.</p>'}
  <label for="pd">نوع المنتج</label><input id="pd" value="${S.prod}"><label for="qt">الكمية</label><input id="qt" inputmode="numeric" value="${S.qty}">
  ${catSel()}<label for="nm">الاسم الثلاثي</label><input id="nm" value="${S.name}"><label for="gv">المحافظة</label><select id="gv"><option value="">اختر</option>${GOV.map(g=>`<option${g===S.gov?' selected':''}>${g}</option>`).join('')}</select>${photoBox()}<div class="err" id="e"></div>
  <button class="btn" id="sendf">أرسل الطلب</button></div>`;
 else h='';
 if(S.n>=1&&S.tab!=='home')h=tabView();A.innerHTML=h+(S.n>=1?navHtml():'');bind()}
function bind(){
 A.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k,v=b.dataset.v;
  if(k==='n'){S.n=+v}else if(k==='svc'){S.svc=v;S.n=2;S.prod='';S.qty='';log('service')}else if(k==='out'){S.n=0;S.tab='home';S.more='';S.svc=''}else{S[k]=v;if(k==='pay')log('pay',{details:v});if(k==='faq')S.faq=+v}draw()});
 ['nm','gv','pd','qt','ct','hs'].forEach((id,i)=>{const e=document.getElementById(id);if(e)e.oninput=e.onchange=()=>{S[['name','gov','prod','qty','cat','hs'][i]]=e.value}});
 [['sc','scbm'],['sd','days'],['sn','cn']].forEach(x=>{const e=document.getElementById(x[0]);if(e)e.onchange=()=>{S[x[1]]=e.value;draw()}});
 const sr=document.getElementById('sendr');if(sr)sr.onclick=()=>{const e=document.getElementById('e'),u=S.svc==='uae';if(!S.name.trim()||!S.prod.trim()){e.textContent='أكمل الاسم والبيانات.';return}const tx=(u?'شحن من الإمارات ('+(S.umode==='land'?'بري':'جوي')+')':'طلب من SHEIN')+' | '+S.prod+' | '+S.qty;S.msg=`أهلاً، أنا ${S.name} (${S.type}). عايز ${tx}. كود ${S.id}`;log(S.svc,{details:tx});addOrder(tx.slice(0,80));S.n=3;draw()};
 const ss=document.getElementById('sendst');if(ss)ss.onclick=()=>{const e=document.getElementById('e');if(!S.name.trim()){e.textContent='اكتب الاسم الثلاثي.';return}const q=stq(),tx=`تخزين ${S.loc==='port'?'داخل':'خارج'} الميناء، ${S.scbm||0} م³، ${S.days} يوم، ${S.cn||0} حاوية${S.dis==='1'?'، مهيئات':''}`;
  S.msg=`أهلاً، أنا ${S.name} (${S.type}). عايز تخزين: ${tx}. التقدير ${fm(q.total)} جنيه. كود ${S.id}`;log('storage',{details:tx,total:fm(q.total)+' ج'});addOrder(tx);S.n=3;draw()};
 const pn=document.getElementById('pn'),pe=document.getElementById('pe');[pn,pe].forEach(e=>{if(e)e.onchange=()=>ls('sm_prof',{n:pn.value,e:pe.value})});
 const ad=document.getElementById('ad');if(ad)ad.onchange=()=>ls('sm_addr',ad.value);
 const fb=document.getElementById('fqb');if(fb)fb.onclick=()=>{const q=document.getElementById('fq').value.trim();if(!q)return;const w=q.split(/\s+/);let b=-1,bs=0;FAQ.forEach((f,i)=>{const sc=w.filter(x=>x.length>2&&(f[0]+f[1]).includes(x)).length;if(sc>bs){bs=sc;b=i}});if(b<0){S.faq=-1;document.getElementById('fq').value='';alert('مفيش إجابة جاهزة للسؤال ده. افتح تبويب المحادثات وكلّم خدمة العملاء.');return}S.faq=b;draw()};
 ['cbm','kg'].forEach(id=>{const e=document.getElementById(id);if(e)e.onchange=()=>{S[id]=e.value;draw()}});
 const pl=document.getElementById('pol');if(pl)pl.onchange=()=>{S.pol=pl.value;draw()};
 const pd2=document.getElementById('pod');if(pd2)pd2.onchange=()=>{S.pod=pd2.value;draw()};
 const ph=document.getElementById('ph');if(ph)ph.oninput=()=>{S.phone=ph.value};
 const pf=document.getElementById('pf');if(pf)pf.onchange=async()=>{const fs=[...pf.files].slice(0,3),o=[];for(const f of fs){const d=await shrink(f);if(d)o.push(d)}S.photos=o;document.getElementById('pc').textContent=o.length?'✓ '+o.length+' صور جاهزة':''};
 const gb=document.getElementById('gb');if(gb)withG(()=>google.accounts.id.renderButton(gb,{theme:'outline',size:'large',locale:'ar'}));
 const go=document.getElementById('go');if(go)go.onclick=()=>{const p=S.phone.replace(/\s/g,''),e=document.getElementById('e');
  if(!S.type){e.textContent='اختر نوعك أولاً.';return}if(!/^01[0125]\d{8}$/.test(p)){e.textContent='اكتب رقم موبايل مصري صحيح من 11 رقم.';return}
  S.phone=p;S.n=1;log('phone');draw()};
 const sq=document.getElementById('sendq');if(sq)sq.onclick=()=>{const q=quote(),e=document.getElementById('e');
  if(!S.name.trim()||!S.gov||!S.cat||!S.prod.trim()){e.textContent='أكمل التصنيف والاسم والمحافظة واسم المنتج.';return}
  S.msg=`أهلاً، أنا ${S.name} (${S.type}) من ${S.gov}. عايز سعر شحن: ${q.txt}. التصنيف: ${S.cat}. المنتج: ${S.prod}${S.hs?' (HS '+S.hs+')':''}. كود الطلب ${S.id}`;
  addOrder(q.txt);log('quote',{photos:S.photos,details:q.txt+' | '+S.cat+' | '+S.prod+' | HS '+S.hs,total:fresh()&&q.ok?(q.cur||'$')+fm(q.usd):''});S.n=3;draw()};
 const sf=document.getElementById('sendf');if(sf)sf.onclick=()=>{const e=document.getElementById('e');
  if(!S.name.trim()||!S.gov||!S.cat||!S.prod.trim()||!(+S.qty>0)){e.textContent='أكمل كل الحقول.';return}
  S.msg=`أهلاً، أنا ${S.name} (${S.type}) من ${S.gov}. ${S.svc==='study'?'عايز دراسة تكلفة استيراد كاملة':'عايز ربط مع مصنع'} (${S.cat}): ${S.prod}${S.hs?' (HS '+S.hs+')':''}، الكمية ${S.qty}. كود الطلب ${S.id}`;
  addOrder(S.svc==='study'?'دراسة تكلفة: '+S.prod:'ربط مصنع: '+S.prod);log(S.svc==='study'?'study':'factory',{photos:S.photos,details:S.cat+' | '+S.prod+' | HS '+S.hs+' | '+S.qty});S.n=3;draw()}}
draw();
</script>
</body>
</html>
